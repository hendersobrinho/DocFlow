name: Release Windows

# Testes em todo push/PR; instalador e release quando sai uma tag vX.Y.Z.
# Rodando na mao (Actions > Release Windows > Run workflow) gera o instalador como
# artefato, sem publicar.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt -r requirements-mcp.txt

      # O Windows do GitHub ja traz o PostgreSQL (usuario postgres, senha root), parado.
      - name: Iniciar PostgreSQL
        shell: pwsh
        run: |
          $servico = Get-Service -Name "postgresql*" | Select-Object -First 1
          Set-Service -InputObject $servico -Status Running -StartupType Automatic
          "DOCFLOW_TEST_DATABASE_URL=postgresql://postgres:root@localhost:5432/docflow_test" >> $env:GITHUB_ENV

      # Sem banco os testes que dependem dele seriam pulados em silencio: aqui falha de verdade.
      - name: Conferir PostgreSQL
        shell: python
        run: |
          import psycopg
          with psycopg.connect("postgresql://postgres:root@localhost:5432/postgres", autocommit=True) as conexao:
              if not conexao.execute("SELECT 1 FROM pg_database WHERE datname = 'docflow_test'").fetchone():
                  conexao.execute("CREATE DATABASE docflow_test")
              print(conexao.execute("SELECT version()").fetchone()[0])

      # O log so abre logado; o trecho dos testes que falharam vira anotacao (::error::).
      - name: Testes
        shell: python
        run: |
          import subprocess, sys
          # O Qt as vezes quebra na desmontagem do processo, depois de todos os testes passarem
          # ("Fatal Python error: Aborted" / access violation ao descarregar as DLLs): o
          # resultado sai com TerminateProcess, que pula essa desmontagem.
          # -u e faulthandler: se o processo cair durante os testes, o log mostra onde parou.
          rodar = (
              "import ctypes, sys, unittest\n"
              "r = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests'))\n"
              "sys.stdout.flush(); sys.stderr.flush()\n"
              # c_void_p(-1) = o proprio processo (handle de 64 bits; sem isso a chamada falha).
              "ctypes.windll.kernel32.TerminateProcess(ctypes.c_void_p(-1), 0 if r.wasSuccessful() else 1)\n"
          )
          r = subprocess.run([sys.executable, "-u", "-X", "faulthandler", "-c", rodar],
                             stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding="utf-8", errors="replace")
          print(r.stdout)
          if r.returncode:
              saida = r.stdout
              inicio = saida.find("=" * 70)
              trecho = (saida[inicio:] if inicio >= 0 else saida[-6000:])[:6000]
              trecho = trecho.replace("%", "%25").replace(chr(13), "").replace(chr(10), "%0A")
              print(f"::error title=Testes falharam::{trecho}")
          sys.exit(r.returncode)

  instalador:
    needs: testes
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt -r requirements-mcp.txt

      - name: Conferir versao
        id: versao
        shell: pwsh
        run: |
          $versao = python -c "from documentos_empresa_app import __version__; print(__version__)"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$versao") {
            Write-Error "A tag ${{ github.ref_name }} nao bate com a versao do sistema ($versao). Suba a versao antes de criar a tag."
            exit 1
          }
          "versao=$versao" >> $env:GITHUB_OUTPUT

      - name: Inno Setup
        shell: pwsh
        run: |
          $pasta = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$pasta\ISCC.exe")) { choco install innosetup -y --no-progress }
          $pasta >> $env:GITHUB_PATH

      # As etapas do scripts\build_release.bat, separadas: quando uma falha, o fim do log dela
      # vira uma anotacao (::error::), que aparece no resumo da execucao.
      - name: Icones
        run: python scripts/generate_icons.py

      - name: PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean documentos_empresa_app.spec *> pyinstaller.log
          $ok = $LASTEXITCODE -eq 0 -and (Test-Path dist\DocFLow\DocFLow.exe) -and (Test-Path dist\DocFLow\DocFLow-MCP.exe)
          Get-Content pyinstaller.log -Tail 15
          if (-not $ok) {
            $fim = (Get-Content pyinstaller.log -Tail 40) -join "%0A"
            Write-Output "::error title=PyInstaller falhou::$fim"
            exit 1
          }

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist_release | Out-Null
          Compress-Archive -Path dist\DocFLow\* -DestinationPath "dist_release\DocFLow-win64-v${{ steps.versao.outputs.versao }}.zip" -Force

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          iscc assets\installer\DocFLow.iss *> iscc.log
          $codigo = $LASTEXITCODE
          Get-Content iscc.log -Tail 15
          if ($codigo -ne 0) {
            $fim = (Get-Content iscc.log -Tail 40) -join "%0A"
            Write-Output "::error title=Inno Setup falhou::$fim"
            exit 1
          }

      - name: Checksums
        id: arquivos
        shell: pwsh
        run: |
          $versao = "${{ steps.versao.outputs.versao }}"
          $arquivos = @("dist_installer\DocFLow-Setup-$versao.exe", "dist_release\DocFLow-win64-v$versao.zip")
          foreach ($arquivo in $arquivos) {
            if (-not (Test-Path $arquivo)) { Write-Error "Nao gerou $arquivo"; exit 1 }
            $hash = (Get-FileHash $arquivo -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $arquivo -Leaf)" | Out-File -Encoding ascii -NoNewline "$arquivo.sha256"
          }

      - name: Notas da versao
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          # O checkout pode trocar a tag anotada por uma simples; busca de novo para ler a mensagem.
          git fetch --force --tags origin
          $anterior = git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>$null
          # Tag anotada (git tag -a vX.Y.Z -m "...") vira as notas; sem mensagem, lista os commits.
          $mensagem = (git tag -l --format='%(contents)' "${{ github.ref_name }}") -join "`n"
          if ($mensagem.Trim()) {
            $texto = $mensagem.Trim()
          } else {
            $faixa = if ($anterior) { "$anterior..${{ github.ref_name }}" } else { "-n 30" }
            $linhas = git log $faixa.Split(" ") --no-merges --pretty=format:"- %s"
            $texto = "## O que mudou`n`n" + ($linhas -join "`n")
          }
          if ($anterior) { $texto += "`n`nComparar: https://github.com/${{ github.repository }}/compare/$anterior...${{ github.ref_name }}" }
          $texto | Out-File -Encoding utf8 notas.md

      - name: Publicar release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: DocFlow ${{ steps.versao.outputs.versao }}
          body_path: notas.md
          files: |
            dist_installer/DocFLow-Setup-${{ steps.versao.outputs.versao }}.exe
            dist_installer/DocFLow-Setup-${{ steps.versao.outputs.versao }}.exe.sha256
            dist_release/DocFLow-win64-v${{ steps.versao.outputs.versao }}.zip
            dist_release/DocFLow-win64-v${{ steps.versao.outputs.versao }}.zip.sha256

      - name: Guardar instalador (rodada manual)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: DocFLow-${{ steps.versao.outputs.versao }}
          path: |
            dist_installer/*.exe
            dist_installer/*.sha256
            dist_release/*.zip
